<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F4F6F8; --surface:#FFFFFF; --ink:#15213B; --muted:#58637D; --line:#D9DFE8; --chip:#E8ECF3;
--blue:#2C55D8; --on-blue:#FFFFFF; --gold:#E7A400; --gold-soft:#FFF1CC; --danger:#B3261E;
--display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--serif:'Source Serif 4',Georgia,'Times New Roman',serif;
--tabh:64px;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--bg:#0F1626; --surface:#172036; --ink:#EEF1F8; --muted:#A3AEC6; --line:#2A3652; --chip:#222E48;
--blue:#7C9BFF; --on-blue:#0F1626; --gold:#F2B632; --gold-soft:#2A2A1E; --danger:#FF8A80;
}
}
:root[data-theme="dark"]{
--bg:#0F1626; --surface:#172036; --ink:#EEF1F8; --muted:#A3AEC6; --line:#2A3652; --chip:#222E48;
--blue:#7C9BFF; --on-blue:#0F1626; --gold:#F2B632; --gold-soft:#2A2A1E; --danger:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden;}
button,input,textarea,select{font:inherit;color:inherit;}
button{-webkit-tap-highlight-color:transparent;}
.app{max-width:640px;margin:0 auto;padding:0 16px 150px;}
.view[hidden]{display:none;}
h1{margin:0;font-size:32px;line-height:1.05;font-weight:700;letter-spacing:-0.025em;}
h2{margin:0;font-weight:700;letter-spacing:-0.015em;}
.lead{margin:6px 0 0;color:var(--muted);font-size:16px;}
.hero{padding:20px 0 8px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600;font-size:17px;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);}
.btn.quiet{border-color:var(--line);color:var(--muted);}
.btn.block{display:flex;width:100%;}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px;}
.btn:focus-visible,.chip:focus-visible,.main:focus-visible,.rtitle:focus-visible,.tab:focus-visible,.back:focus-visible,.bk-more summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.btn:active{transform:scale(.98);}
textarea,input[type=text],input[type=number],input[type=search],select{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;width:100%;}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
textarea{font-family:var(--serif);font-size:18px;line-height:1.5;resize:vertical;min-height:104px;}
/* estante: barra fixa de busca e filtros */
.search{border-radius:999px;padding-left:18px;margin-top:4px;}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:10px -16px 0;padding:8px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.addbtn{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:0;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;cursor:pointer;}
.addbtn svg{width:24px;height:24px;}
.addbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.chips{flex:1 1 auto;min-width:0;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;margin:0;padding:0 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;min-height:44px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap;scroll-snap-align:start;}
.chip .n{margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400;}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.8;}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 2px;font-size:15px;color:var(--muted);}
.countrow select{width:auto;min-height:44px;padding:6px 12px;font-size:16px;}
/* lista de livros */
.list{list-style:none;margin:0;padding:0;}
.item{display:grid;grid-template-columns:88px 1fr;column-gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:14px 0;}
.item.lendo{background:var(--gold-soft);box-shadow:inset 5px 0 0 var(--gold);margin:0 -16px;padding-left:16px;padding-right:16px;}
.item.descartado{opacity:.72;}
.chk{position:relative;display:flex;width:48px;height:48px;align-items:center;justify-content:flex-start;cursor:pointer;margin-top:-4px;}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
.box{width:28px;height:28px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;background:var(--surface);margin-left:2px;}
.chk input:checked + .box{background:var(--blue);border-color:var(--blue);}
.chk input:checked + .box::after{content:"";width:7px;height:13px;border:solid var(--on-blue);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);}
.chk input:focus-visible + .box{outline:3px solid var(--gold);outline-offset:2px;}
.chk input:disabled + .box{opacity:.4;}
.main{display:block;min-width:0;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;}
.main .t{display:block;font-weight:700;font-size:18px;line-height:1.25;}
.item.lido .main .t{color:var(--muted);}
.main .a{display:block;color:var(--muted);font-size:15px;margin-top:2px;}
.main .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);font-size:16px;line-height:1.45;margin-top:6px;}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pill{display:inline-block;white-space:nowrap;font-size:14px;line-height:1.2;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink);}
.pill.muted{color:var(--muted);}
.pill.tag{background:var(--gold);color:#15213B;font-weight:600;}
.pill.tag.lido{background:var(--blue);color:var(--on-blue);}
.pill.tag.off{background:var(--line);color:var(--muted);}
.empty{margin:0;color:var(--muted);}
.empty-state{padding:36px 4px;text-align:center;}
.empty-state h2{font-size:22px;}
.empty-state p{margin:8px auto 18px;color:var(--muted);max-width:32ch;}
.empty-state .btn{margin:0 auto 10px;max-width:320px;}
/* livro */
.back{display:inline-flex;align-items:center;gap:4px;min-height:48px;margin:8px 0 0 -8px;padding:0 12px 0 4px;background:none;border:0;font-weight:600;font-size:17px;color:var(--blue);cursor:pointer;}
.bk-head{margin-top:4px;}
.bk-head h2{font-size:30px;line-height:1.1;margin-top:8px;}
.bk-head .by{margin:4px 0 0;color:var(--muted);font-size:17px;}
.bk-head h2 a.buy{color:inherit;text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:3px;text-underline-offset:6px;}
.bk-head h2 a.buy svg{display:inline-block;vertical-align:baseline;margin-left:4px;color:var(--blue);}
.bk-head h2 a.buy:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px;}
.bk-buy{margin:6px 0 0;color:var(--muted);font-size:14px;}
.bk-vibe{margin:12px 0 0;color:var(--blue);font-weight:600;font-size:15px;}
.bk-more{margin-top:8px;}
.bk-more summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--blue);}
.bk-more .bk-syn{margin-top:2px;}
.bk-syn{margin:12px 0 0;font-family:var(--serif);font-size:19px;line-height:1.55;}
.bk-act{margin-top:20px;display:grid;gap:10px;}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden;}
.fill{height:100%;background:var(--gold);border-radius:6px;}
.pinfo{margin:0 0 10px;font-size:17px;font-variant-numeric:tabular-nums;}
.pinfo b{font-weight:700;}
.progress .track{height:14px;border-radius:7px;}
.progress .fill{border-radius:7px;}
.pends{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.lp{display:block;margin-top:10px;}
.lp-bar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.lp-bar i{display:block;height:100%;background:var(--gold);border-radius:4px;}
.lp-txt{display:block;margin-top:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
.pstep{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;margin-top:12px;}
.pstep input{text-align:center;font-size:20px;font-weight:600;}
.pstep .btn{padding:8px 0;}
.notes{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;}
.notes h3{margin:0 0 10px;font-size:20px;font-weight:700;}
.noteline{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-top:8px;}
.noteline label{display:block;}
.notelist{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:16px;}
.note{border-left:3px solid var(--line);padding:2px 0 2px 14px;}
.note p{margin:0;font-family:var(--serif);font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;}
.note .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;font-size:14px;color:var(--muted);}
.link{background:none;border:0;padding:0 4px;min-height:44px;min-width:64px;color:var(--danger);cursor:pointer;font-size:15px;text-decoration:underline;}
/* resumo */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;}
.stat b{display:block;font-size:28px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;}
.stat span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.2;}
.total{margin-top:16px;}
.total .row{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-bottom:6px;}
.total .track{height:14px;}
.total .fill{background:var(--blue);}
.shelf-title{margin:28px 0 0;font-size:20px;font-weight:700;}
.shelf-hint{margin:4px 0 0;color:var(--muted);font-size:15px;}
.shelf{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:4px solid var(--ink);padding:0 2px;margin-top:14px;}
.spine{flex:1 1 0;min-width:8px;max-width:34px;border:1.5px solid var(--muted);border-bottom:0;border-radius:4px 4px 0 0;background:transparent;padding:0;cursor:pointer;}
.spine.lido{background:var(--blue);border-color:var(--blue);}
.spine.lendo{background:var(--gold);border-color:var(--gold);}
.spine.sel{outline:3px solid var(--ink);outline-offset:2px;}
.spine:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:15px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted);display:inline-block;}
.sw.lido{background:var(--blue);border-color:var(--blue);}
.sw.lendo{background:var(--gold);border-color:var(--gold);}
.pick{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.pick p{margin:0;font-size:17px;}
.pick small{display:block;color:var(--muted);font-size:15px;margin-top:2px;}
.pickbtns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:12px;}
.pickbtns .btn{padding:8px 6px;}
.sync{margin:22px 0 0;font-size:14px;color:var(--muted);}
.linkrow{margin-top:20px;}
/* capas */
.cv{position:relative;container-type:inline-size;aspect-ratio:3 / 4;background:var(--chip);border-radius:12px;overflow:hidden;}
.cv img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(10,20,50,.35));}
.cv .ph{position:absolute;top:8%;bottom:8%;left:50%;transform:translateX(-50%);aspect-ratio:2 / 3;border-radius:3px;color:#fff;padding:9% 8%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 2px 6px rgba(10,20,50,.3);}
.cv .ph::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:rgba(255,255,255,.22);}
.ph-t{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;line-height:1.1;font-size:max(9px,11cqw);overflow-wrap:anywhere;padding-left:6%;}
.ph-a{font-size:max(8px,6.5cqw);opacity:.9;line-height:1.15;overflow-wrap:anywhere;padding-left:6%;}
.cv.sm{width:88px;}
.cv.sm .ph-a{display:none;}
.bk-top{display:grid;gap:16px;justify-items:center;margin-top:4px;}
.bk-cover{width:min(58vw,220px);}
.bk-info{width:100%;}
.cvbtns{margin-top:10px;display:grid;gap:8px;}
.cv-note{margin:0;color:var(--muted);font-size:13px;line-height:1.35;text-align:center;}
.cvbtns a.btn{text-decoration:none;}
@media (min-width:560px){
.bk-top{grid-template-columns:200px 1fr;justify-items:stretch;align-items:start;gap:24px;}
.bk-cover{width:200px;}
.cv-note{text-align:left;}
}
/* notas e ranking */
.pill.star{background:transparent;border:1.5px solid var(--gold);padding:2.5px 9px;}
.pill.star b{margin-right:6px;}
.rate{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.rate-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.rate-n{font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;}
.rate-of{color:var(--muted);font-size:16px;}
.rate-pos{margin-left:auto;font-weight:700;font-size:16px;}
.rate-note{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.4;}
.rank{list-style:none;margin:6px 0 0;padding:0;}
.rrow{position:relative;display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:8px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);}
.rrow.lendo{background:var(--gold-soft);box-shadow:inset 5px 0 0 var(--gold);margin:0 -16px;padding-left:16px;padding-right:16px;}
.rrow.lido .rtitle{color:var(--muted);}
.rpos{font-size:24px;line-height:1.1;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;}
.rpos.top{color:var(--ink);}
.rname{min-width:0;}
.rtitle{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font-weight:700;font-size:17px;line-height:1.25;cursor:pointer;}
.rtitle::after{content:"";position:absolute;inset:0;}
.rtitle:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.rname .a{display:block;color:var(--muted);font-size:14px;margin-top:2px;}
.rname .m{display:block;color:var(--muted);font-size:13px;margin-top:2px;}
.rscore{text-align:right;font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;}
.rscore small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
.rbar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.rbar i{display:block;height:100%;background:var(--blue);border-radius:3px;}
.rk-sub{margin:28px 0 0;font-size:20px;font-weight:700;}
.rk-hint{margin:4px 0 8px;color:var(--muted);font-size:15px;}
.rk-un{list-style:none;margin:0;padding:0;}
.rk-un button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);min-height:52px;padding:8px 0;font-size:16px;cursor:pointer;}
.rk-un button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.rk-foot{margin:22px 0 0;color:var(--muted);font-size:14px;line-height:1.45;}
.rchips{display:flex;gap:8px;margin-top:6px;}
/* navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 8px calc(0px + env(safe-area-inset-bottom,0px));}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tabh);background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;}
.tab svg{width:26px;height:26px;}
.tab[aria-current="page"]{color:var(--ink);}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--blue);}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;}
.toast[hidden]{display:none;}
.toast button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--gold);font-weight:700;font-size:16px;cursor:pointer;}
.toast button[hidden]{display:none;}
/* adicionar livro */
dialog{border:0;padding:0;width:100%;max-width:640px;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);max-height:92vh;max-height:92dvh;overflow:auto;}
dialog::backdrop{background:rgba(10,16,32,.55);}
.dlg{padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
.dlg-head h2{font-size:24px;}
.dlg label{display:grid;gap:6px;margin-top:14px;font-size:15px;color:var(--muted);}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dlg textarea{min-height:92px;font-size:17px;}
.addmsg{min-height:1.4em;margin:10px 0 0;font-size:15px;color:var(--danger);}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important;transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="app">
<main>
<section class="view" id="v-estante" aria-label="Estante">
<header class="hero">
<h1>Minha estante</h1>
<p class="lead">Livros curtos e fáceis para começar. Toque num livro para ver os detalhes.</p>
</header>
<input class="search" type="search" id="busca" placeholder="Buscar título, autor ou gênero" aria-label="Buscar livros" enterkeyhint="search">
<div class="bar">
<div class="chips" id="chips" role="group" aria-label="Filtrar por situação">
<button class="chip" data-f="todos" aria-pressed="true">Todos<span class="n"></span></button>
<button class="chip" data-f="para-ler" aria-pressed="false">Para ler<span class="n"></span></button>
<button class="chip" data-f="lendo" aria-pressed="false">Lendo<span class="n"></span></button>
<button class="chip" data-f="lido" aria-pressed="false">Lidos<span class="n"></span></button>
<button class="chip" data-f="descartado" aria-pressed="false">Descartados<span class="n"></span></button>
</div>
<button class="addbtn" id="fab" type="button" aria-label="Adicionar livro">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
<div class="countrow">
<span id="count"></span>
<label><span class="sr">Ordenar por</span>
<select id="ordem" aria-label="Ordenar por">

}
/* resumo */
function renderResumo(){
var host = $('v-resumo');
var all = active(), lidos = all.filter(function(b){ return state.read[b.id]; });
var pag = lidos.reduce(function(n,b){ return n + b.p; }, 0);
if(state.reading && !state.read[state.reading]){ var rb = byId(state.reading); if(rb) pag += Math.min(state.progress[state.reading] || 0, rb.p); }
if(!shelfSel || !all.some(function(b){ return b.id === shelfSel; })){ shelfSel = (state.reading && !state.discarded[state.reading]) ? state.reading : (all[0] ? all[0].id : null); }
var totalP = all.reduce(function(n,b){ return n + b.p; }, 0);
var pctBar = totalP ? Math.min(100, Math.round(pag / totalP * 100)) : 0;
var nd = Object.keys(state.discarded).filter(function(id){ return byId(id) && !state.read[id]; }).length;
var h = '<header class="hero"><h1>Resumo</h1><p class="lead">Seu progresso de leitura em um só lugar.</p></header>';
h += '<div class="stats"><div class="stat"><b>' + lidos.length + '/' + all.length + '</b><span>livros lidos</span></div>' +
'<div class="stat"><b>' + (state.reading ? 1 : 0) + '</b><span>lendo agora</span></div></div>';
h += '<div class="total"><div class="row"><span>Páginas lidas</span><span>' + pag.toLocaleString('pt-BR') + ' de ' + totalP.toLocaleString('pt-BR') + '</span></div>' +
'<div class="track" role="progressbar" aria-label="Páginas lidas da estante" aria-valuemin="0" aria-valuemax="' + totalP + '" aria-valuenow="' + pag + '"><div class="fill" style="width:' + pctBar + '%"></div></div></div>';
h += '<h2 class="shelf-title">Sua estante</h2><p class="shelf-hint">Cada lombada é um livro. Quanto mais alta, mais páginas. Toque numa lombada ou use os botões abaixo para navegar.</p>';
h += '<div class="shelf" id="shelf">' + all.map(function(b){
var st = status(b.id), ht = 36 + Math.round(Math.min(b.p, 420) / 420 * 108);
return '<button type="button" class="spine ' + st + (shelfSel === b.id ? ' sel' : '') + '" style="height:' + ht + 'px" data-act="spine" data-id="' + esc(b.id) + '" aria-label="' + esc(b.t) + ', ' + statusLabel(st) + '"></button>';
}).join('') + '</div>';
h += '<div class="legend"><span><i class="sw lido"></i>Lido</span><span><i class="sw lendo"></i>Lendo</span><span><i class="sw"></i>Para ler</span></div>';
var sb = shelfSel ? byId(shelfSel) : null;
if(sb){
h += '<div class="pick"><p><b>' + esc(sb.t) + '</b><small>' + esc(sb.a) + ', ' + pagesLabel(sb) + ' páginas, ' + statusLabel(status(sb.id)) + '</small></p>' +
'<div class="pickbtns"><button class="btn small" type="button" data-act="spine-prev">Anterior</button>' +
'<button class="btn small primary" type="button" data-act="abrir" data-id="' + esc(sb.id) + '">Abrir livro</button>' +
'<button class="btn small" type="button" data-act="spine-next">Próximo</button></div></div>';
}
if(nd){ h += '<div class="linkrow"><button class="btn block" type="button" data-act="ver-descartados">Ver ' + nd + (nd === 1 ? ' livro descartado' : ' livros descartados') + '</button></div>'; }
h += '<p class="sync" id="sync">' + esc(syncMsg) + '</p>';
host.innerHTML = h;
}
function renderTabs(){
var other = (view === 'livro' && state.focus && state.focus !== state.reading);
$('tab-livro-label').textContent = (state.reading && !other) ? 'Lendo' : 'Livro';
$('dot').hidden = !state.reading;
}
function renderAll(){
renderTabs();
if(view === 'estante'){ renderChips(); renderList(); }
else if(view === 'livro'){ renderLivro(); }
else if(view === 'ranking'){ renderRanking(); }
else { renderResumo(); }
}
/* eventos */
document.addEventListener('click', function(e){
var go1 = e.target.closest('[data-go]');
if(go1 && go1.getAttribute('data-go') !== view){
var dest = go1.getAttribute('data-go');
if(dest === 'livro' && state.reading){ state.focus = state.reading; draft = {id:state.focus, text:'', page:''}; backTo = view; }
go(dest); return;
}
var rf = e.target.closest('[data-rf]');
if(rf){ rankFilter = rf.getAttribute('data-rf'); renderRanking(); return; }
var el = e.target.closest('[data-act]'); if(!el || el.type === 'checkbox') return;
var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
if(act === 'abrir') openBook(id);
else if(act === 'voltar') go(backTo);
else if(act === 'comecar') startReading(state.focus);
else if(act === 'parar'){ var s1 = snapshot(); state.reading = null; commit(); toast('Leitura pausada.', s1); }
else if(act === 'concluir') markRead(state.focus, true);
else if(act === 'desmarcar') markRead(state.focus, false);
else if(act === 'descartar') descartar(state.focus);
else if(act === 'restaurar') restaurar(state.focus);
else if(act === 'remover') removeCustom(state.focus);
else if(act === 'mais') setProgress(state.focus, (state.progress[state.focus] || 0) + 10);
else if(act === 'menos') setProgress(state.focus, (state.progress[state.focus] || 0) - 10);
else if(act === 'nota') addNote();
else if(act === 'apagar') delNote(state.focus, el.getAttribute('data-nid'));
else if(act === 'spine'){ shelfSel = id; renderResumo(); }
else if(act === 'spine-prev' || act === 'spine-next'){
var ls = active(), ix = 0;
ls.forEach(function(b,i){ if(b.id === shelfSel) ix = i; });
ix = (ix + (act === 'spine-next' ? 1 : -1) + ls.length) % ls.length;
shelfSel = ls[ix].id; renderResumo();
}
else if(act === 'ver-descartados'){ filtro = 'descartado'; go('estante'); }
else if(act === 'capa'){ $('capa-input').click(); }
else if(act === 'capa-remover'){ delete covers[state.focus]; saveCovers(); renderAll(); toast('Foto removida.'); }
else if(act === 'capa-outra'){
var a1 = autoUrls[state.focus];
if(a1 && a1.c && a1.c.length > 1){ a1.i = ((a1.i || 0) + 1) % a1.c.length; a1.u = a1.c[a1.i].u; saveAuto(); renderAll(); }
}
else if(act === 'capa-nenhuma'){ autoUrls[state.focus] = {u: null, t: Date.now() + 10 * 365 * 24 * 3600 * 1000}; saveAuto(); renderAll(); }
else if(act === 'curto'){
var pend = books().filter(function(b){ return !state.read[b.id] && !state.discarded[b.id]; }).sort(function(x,y){ return x.p - y.p; })[0];
if(pend){ startReading(pend.id); go('livro'); }
}
});
document.addEventListener('change', function(e){
var t = e.target;
if(t.getAttribute && t.getAttribute('data-act') === 'check') markRead(t.getAttribute('data-id'), t.checked);
else if(t.id === 'pg-atual') setProgress(state.focus, parseInt(t.value, 10));
else if(t.id === 'ordem'){ ordem = t.value; renderList(); }
});
document.addEventListener('input', function(e){
var t = e.target;
if(t.id === 'nota-texto') draft.text = t.value;
else if(t.id === 'nota-pg') draft.page = t.value;
else if(t.id === 'busca'){ termo = t.value; renderList(); }
});
document.addEventListener('keydown', function(e){
if(e.target.id === 'nota-texto' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addNote(); }
});
$('chips').addEventListener('click', function(e){
var c = e.target.closest('.chip'); if(!c) return;
filtro = c.getAttribute('data-f'); renderChips(); renderList();
});
$('fab').addEventListener('click', openDialog);
$('capa-input').addEventListener('change', function(e){
var f = e.target.files && e.target.files[0];
var id = state.focus;
e.target.value = '';
if(f && id) processCover(f, id);
});
$('dlg-close').addEventListener('click', closeDialog);
$('add-cancel').addEventListener('click', closeDialog);
$('form-add').addEventListener('submit', function(e){ e.preventDefault(); addBook(); });
$('toast-undo').addEventListener('click', function(){
if(!undoSnap) return;
state = normalize(JSON.parse(undoSnap)); hideToast(); commit();
});
$('dlg-add').addEventListener('click', function(e){ if(e.target === $('dlg-add')) closeDialog(); });
if(!state.focus && state.reading) state.focus = state.reading;
renderAll();
initRemote();
if(AUTO_COVERS){ visibleBooks().concat(books()).forEach(function(b){ ensureAuto(b); }); }
})();
</script>
</body>
</html>
